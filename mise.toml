# ==================================================================================== #
# Tool versions and project tasks.
#
# This replaces the Makefile from chapter 19 of "Let's Go Further". A note on
# syntax, since mise tasks have their own conventions:
#
#   [tasks."name"]   task names are quoted because they contain a `/`. Run them
#                    with `mise run <name>`, e.g. `mise run run/api`.
#
#   depends = [...]  tasks that must complete first.
#
#   run = [...]      a list runs the commands in series; a single string runs one
#                    command; a '''...''' block is a shell script.
#
#   confirm = "..."  prompts before running — replaces the Makefile's `confirm`
#                    target that destructive targets depended on.
#
#   {{ vars.x }}     a variable from the [vars] table below. Each one falls back
#                    to an environment variable, so they can be overridden per
#                    run: `fuzztime=10s mise run test/fuzz`.
#
#   [env]            environment for every task, loaded from .env — this is how
#                    the application itself is configured. See the block below.
#
# `mise tasks` lists everything with descriptions — no hand-written help target
# is needed, which is why the Makefile's `help` target has no equivalent here.
# ==================================================================================== #

[tools]
go = "1.26.5"

# Dev-only CLIs used by the QUALITY CONTROL tasks below (lint, vuln,
# test/summary, test/bench/compare). mise installs these automatically —
# unlike `go`, nothing in the module itself needs them, so they stay out of
# go.mod. golang-migrate is deliberately NOT here: see the comment on
# db/migrations/new for why.
#
# Pinned rather than "latest": these run in `lint`/`vuln`/`test/summary`,
# and an unpinned tool can start failing a clean tree when upstream ships a
# new default-enabled linter or check — with no code change on our side to
# explain it. Bump deliberately by editing the version here.
golangci-lint = "2.12.2"
gotestsum = "1.13.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"

# Used by run/api/watch (mise watch shells out to it). Pinned like the rest so
# `mise install` fetches it and nobody has to discover the dependency by
# reading an error message.
watchexec = "2.5.1"

# Also pinned, for an extra reason: x/perf has no tagged releases, so
# "latest" would mean "whatever commit is newest right now" via a
# pseudo-version — and it also trips mise's minimum_release_age check on
# every run, since a freshly-computed pseudo-version always looks brand new.
"go:golang.org/x/perf/cmd/benchstat" = "0.0.0-20260813145340-fd4a688df892"

[env]
# Local development configuration — including SMTP credentials — lives in .env,
# which is gitignored. mise loads it into the environment of every task, which
# is how `mise run run/api` picks up settings that are written down nowhere in
# this file. Copy .env.example to .env to get started; a missing .env is fine
# and simply leaves every setting at its default.
#
# Nothing in the Go code knows about .env, or about mise. The binaries read
# plain environment variables (see internal/envflag), so in Docker or Kubernetes
# the same variables arrive from `env_file:` or a Secret instead, and the
# application is unchanged.
#
# Two behaviours worth knowing, both verified rather than assumed:
#
#   - .env takes precedence over the surrounding shell environment. Exporting
#     GREENLIGHT_DB_DSN in your shell will NOT override a value set in .env.
#   - .env is loaded too late to be visible to [vars] templating below, which
#     mise renders from the process environment. That's why the database tasks
#     expand ${GREENLIGHT_DB_DSN} in the shell rather than through a var.
_.file = ".env"

[vars]
# Where the migration .sql files live.
migrations_path = "{{ env.migrations_path | default(value='./migrations') }}"

# How long each fuzz target runs. Override with: fuzztime=10s mise run test/fuzz
fuzztime = "{{ env.fuzztime | default(value='30s') }}"

# Linker flags:
#   -s  strip the symbol table
#   -w  strip DWARF debug information
#
# Together these cut roughly 25% off the binary size. We do NOT need the book's
# `-X main.version=...` trick, because Go embeds the VCS revision automatically
# since 1.18 — see vcsRevision() in cmd/api/main.go.
linker_flags = "-s -w"

# ==================================================================================== #
# DEVELOPMENT
# ==================================================================================== #

[tasks."run/api"]
description = "run the API server"
# Migrations run automatically on startup, so this works against an empty
# directory with no setup at all.
#
# No -db-dsn flag here on purpose: the binary reads GREENLIGHT_DB_DSN itself, so
# .env drives it. Passing the flag would OUTRANK the environment (flag > env >
# default) and silently ignore whatever .env said — the least debuggable
# failure mode this design has.
run = "go run ./cmd/api"

[tasks."run/api/watch"]
description = "run the API server, restarting on source changes"
# Live reload, the Go way: there is no HMR — the server is rebuilt and
# restarted, exactly like nodemon. A warm incremental rebuild of ./cmd/api is
# well under a second, which is what makes this practical.
#
# This wraps `run/api` rather than repeating `go run ./cmd/api`, and that is
# the whole reason it uses `mise watch` instead of air or wgo. Those tools
# build and exec the binary themselves, so they would bypass mise entirely —
# missing the .env file loaded by [env] above (leaving GREENLIGHT_DB_DSN at
# its default, pointed at a different database from the one db/shell opens)
# and missing the Go version pinned in [tools] (building with whatever `go`
# happens to be on PATH). Going through the task means neither can drift.
#
#   -r          restart the server on change. The default is 'do-nothing',
#               which ignores events while the command is still running — for
#               a long-lived server that means it would never restart at all.
#   --exts      .sql is in here because the migrations are go:embed-ed, so a
#               schema edit only takes effect after a rebuild.
#
# Two watchexec defaults do useful work here and are deliberately left alone:
#
#   - It reads .gitignore, so *.db / *.db-wal / *.db-shm are already excluded.
#     That matters more than it looks: WAL journalling writes those constantly
#     while the server runs, so without the exclusion the server would restart
#     itself in a loop, forever, because it wrote to disk.
#   - Restart sends SIGTERM and waits up to 10s (--stop-signal/--stop-timeout),
#     so serve()'s graceful shutdown drains in-flight requests and closes the
#     database cleanly instead of leaving a stale -wal behind.
#
# Debounce defaults to 50ms — enough to coalesce the several filesystem events
# one editor save emits, and to avoid building a half-written file. Raise it
# with -d 200ms if format-on-save triggers duplicate rebuilds.
#
# Cosmetic wart, not a bug: each restart prints two lines,
#
#   [run/api] ERROR sh exited with non-zero status: no exit status
#   [run/api] ERROR task failed
#
# That is mise reporting the task shell as failed because watchexec terminated
# it with a signal. The server itself shut down cleanly — the "stopped server"
# log line immediately above proves it. Nothing to fix; don't chase it.
run = "mise watch -r --exts go,sql run/api"

[tasks."run/seed"]
description = "create a demo user with sample data and print an auth token"
run = "go run ./cmd/seed"

[tasks."db/shell"]
description = "open a sqlite3 shell against the database"
# The sqlite3 CLI has no idea about GREENLIGHT_DB_DSN, so the default is
# repeated here in shell syntax. It's expanded by the shell at run time, not by
# mise at template time, which is what lets it see the value from .env.
run = 'sqlite3 "${GREENLIGHT_DB_DSN:-greenlight.db}"'

[tasks."db/migrations/new"]
description = "create a new pair of migration files"
# Requires the golang-migrate CLI:
#   go install -tags 'sqlite' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
#
# Note you only need the CLI to CREATE migrations. Applying them needs nothing
# extra, because the .sql files are embedded in the binary and applied on
# startup (see internal/db.MigrateUp).
#
# Unlike the Makefile's `name=...` variable, the name is a required positional
# argument — `mise run db/migrations/new add_foo`. mise refuses to run the task
# at all if it's missing, instead of creating a migration with an empty name.
usage = 'arg "<name>" help="name of the migration, e.g. add_foo"'
run = [
    "echo 'Creating migration files for {{ usage.name }}...'",
    "migrate create -seq -ext=.sql -dir={{ vars.migrations_path }} {{ usage.name }}",
]

[tasks."db/migrations/up"]
description = "apply all up migrations manually"
# Normally unnecessary — the API applies them itself on startup. This task is
# here for when you want to migrate without running the server.
run = [
    "echo 'Running up migrations...'",
    'migrate -path={{ vars.migrations_path }} -database="sqlite://${GREENLIGHT_DB_DSN:-greenlight.db}" up',
]

[tasks."db/migrations/down"]
description = "roll back all migrations"
confirm = "Are you sure? This rolls back every migration."
run = 'migrate -path={{ vars.migrations_path }} -database="sqlite://${GREENLIGHT_DB_DSN:-greenlight.db}" down'

[tasks."db/migrations/version"]
description = "print the current migration version"
run = 'migrate -path={{ vars.migrations_path }} -database="sqlite://${GREENLIGHT_DB_DSN:-greenlight.db}" version'

[tasks."db/reset"]
description = "delete the database file and start over"
confirm = "Are you sure? This deletes the database file."
# A shell block rather than a list, so the path is named once instead of six
# times across the rm and its -wal/-shm siblings.
run = '''
db="${GREENLIGHT_DB_DSN:-greenlight.db}"
rm -f "$db" "$db-wal" "$db-shm"
echo "Database removed. It will be recreated and migrated on next run."
'''

# ==================================================================================== #
# QUALITY CONTROL
# ==================================================================================== #

[tasks.audit]
description = "format, vet, and test everything"
depends = ["tidy"]
run = [
    "echo 'Formatting code...'",
    "go fmt ./...",
    "echo 'Vetting code...'",
    "go vet ./...",
    "echo 'Running tests...'",
    "go test -race -vet=off ./...",
]

[tasks.tidy]
description = "tidy and verify module dependencies"
run = [
    "echo 'Tidying module dependencies...'",
    "go mod tidy",
    "echo 'Verifying module dependencies...'",
    "go mod verify",
]

[tasks.lint]
description = "run golangci-lint (aggregates vet, staticcheck, errcheck, and more)"
# CLI comes from [tools] above (mise installs it). Not part of `audit` —
# `audit` is deliberately dependency-free (plain `go` commands only).
run = "golangci-lint run ./..."

[tasks.vuln]
description = "scan module dependencies against the Go vulnerability database"
# CLI comes from [tools] above (mise installs it).
run = "govulncheck ./..."

[tasks.test]
# TODO - maybe remove in favor of test/summary? 
description = "run all Test* functions (see test/fuzz and test/bench for the rest)"
run = "go test -race ./..."

[tasks."test/summary"]
description = "run tests through gotestsum for a readable pass/fail summary"
# CLI comes from [tools] above (mise installs it).
run = "gotestsum --format testname -- -race ./..."

[tasks."test/short"]
description = "run only the fast unit tests, skipping database-backed ones"
run = "go test -short ./..."

[tasks."test/cover"]
description = "run tests and open the HTML coverage report"
# -coverpkg=./... measures coverage of EVERY package, not just the one whose
# tests are running. Without it, internal/db reports 0% — it has its own tests
# now, but most of its lines are exercised through internal/testutil from other
# packages, and the default per-package instrumentation doesn't credit that.
run = [
    "go test -coverpkg=./... -coverprofile=/tmp/coverage.out ./...",
    "go tool cover -html=/tmp/coverage.out",
]

[tasks."test/fuzz"]
description = "run each fuzz target in turn (override with fuzztime=10s)"
# Not part of `audit`: fuzzing is open-ended, so it's something you run
# deliberately rather than on every commit. A crasher gets written to the
# package's testdata/fuzz/ directory and becomes a permanent seed for the normal
# `go test` run — so a failure here turns itself into a regression test, and you
# commit the file.
#
# Two constraints shape this task:
#   - -fuzz takes one PACKAGE at a time, and
#   - the regexp must match exactly ONE target, or the toolchain refuses with
#     "-fuzz matches more than one fuzz test". internal/data has two, so every
#     target is named individually rather than matched with a bare `Fuzz`.
#
# -run=^$ matches no ordinary test, so each line does nothing but fuzz. (In the
# Makefile this had to be written `^$$` to escape it from make; mise needs no
# such escaping.)
run = [
    "go test -run=^$ -fuzz=FuzzRuntimeUnmarshalJSON -fuzztime={{ vars.fuzztime }} ./internal/data/",
    "go test -run=^$ -fuzz=FuzzGenresScan -fuzztime={{ vars.fuzztime }} ./internal/data/",
    "go test -run=^$ -fuzz=FuzzEmailRX -fuzztime={{ vars.fuzztime }} ./internal/validator/",
    "go test -run=^$ -fuzz=FuzzReadJSON -fuzztime={{ vars.fuzztime }} ./cmd/api/",
]

[tasks."test/bench"]
description = "run all benchmarks with allocation counts"
run = "go test -bench=. -benchmem -run=^$ ./..."

[tasks."test/bench/compare"]
description = "compare two benchmark runs for statistically significant deltas"
# CLI comes from [tools] above (mise installs it).
#
# Typical workflow: capture a baseline, make your change, capture again:
#   mise run test/bench > /tmp/bench-old.txt
#   ...make your change...
#   mise run test/bench > /tmp/bench-new.txt
#   mise run test/bench/compare /tmp/bench-old.txt /tmp/bench-new.txt
usage = '''
arg "<old>" help="path to the baseline benchmark output"
arg "<new>" help="path to the new benchmark output"
'''
run = "benchstat {{ usage.old }} {{ usage.new }}"

# ==================================================================================== #
# BUILD
# ==================================================================================== #

[tasks."build/api"]
description = "build the API server for the current platform"
run = [
    "echo 'Building cmd/api...'",
    "go build -ldflags='{{ vars.linker_flags }}' -o=./bin/api ./cmd/api",
    "go build -ldflags='{{ vars.linker_flags }}' -o=./bin/seed ./cmd/seed",
]

[tasks."build/linux"]
description = "cross-compile the API server for linux/amd64"
# This is where the pure-Go SQLite driver earns its keep: with the cgo-based
# mattn/go-sqlite3 you'd need a linux C cross-toolchain. Here it's one command
# with no extra setup.
env = { GOOS = "linux", GOARCH = "amd64", CGO_ENABLED = "0" }
run = [
    "echo 'Building for linux/amd64...'",
    "go build -ldflags='{{ vars.linker_flags }}' -o=./bin/linux_amd64/api ./cmd/api",
]
